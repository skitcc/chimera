name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-tooling:
    name: Performance report calculations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate performance scripts and calculations
        run: |
          for script in deploy/perf/run.sh deploy/perf/reset.sh deploy/perf/isolate.sh deploy/postgres/primary.sh deploy/postgres/replica.sh deploy/postgres/init-databases.sh; do
            sh -n "$script" || exit 1
          done
          python3 -m unittest discover -s deploy/perf -p 'test_*.py'

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint proto
        working-directory: backend
        run: make proto-lint

      - name: Generated code is up to date
        working-directory: backend
        run: |
          make proto
          git diff --exit-code -- contracts/gen
          test -z "$(git status --porcelain -- contracts/gen)"

      - name: No breaking changes against develop
        working-directory: backend
        run: |
          if ! git cat-file -e origin/develop:backend/contracts/buf.yaml 2>/dev/null; then
            echo "develop has no contracts yet; nothing to compare"
            exit 0
          fi
          make proto-breaking BUF_AGAINST='.git#ref=refs/remotes/origin/develop,subdir=backend/contracts'

  system:
    name: System under test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_NEW_PASSWORD: ${{ secrets.E2E_NEW_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          cp .env.example .env
          E2E_ENV_OUTPUT=.env sh backend/scripts/e2e-secrets.sh

      - name: Validate E2E repository secrets
        run: sh backend/scripts/check-e2e-credentials.sh

      - name: Start system under test
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test through the Gateway
        run: |
          set -eu
          set -a
          . ./.env
          set +a

          api="http://127.0.0.1:${API_PORT}"
          web="http://127.0.0.1:${FRONTEND_PORT}"

          wait_http() {
            url="$1"
            i=0
            while [ "$i" -lt 30 ]; do
              if curl -fsS -o /dev/null "$url"; then
                return 0
              fi
              i=$((i + 1))
              sleep 2
            done
            printf 'timed out waiting for %s\n' "$url" >&2
            return 1
          }

          # Gateway /ready is green only when Identity, Catalog and Social answer gRPC health.
          wait_http "${api}/live"
          wait_http "${api}/ready"
          wait_http "${api}/v1/tracks"
          wait_http "${web}/"
          wait_http "${web}/live"
          wait_http "${web}/api/v1/tracks"

          smoke_password=$E2E_USER_PASSWORD
          echo "::add-mask::$smoke_password"
          jq -n --arg password "$smoke_password" '{email:"ci-smoke@example.com",name:"CI",password:$password}' > /tmp/smoke-register.json
          jq -n --arg password "$smoke_password" '{email:"ci-smoke@example.com",password:$password}' > /tmp/smoke-login.json
          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST "${api}/v1/users" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/smoke-register.json)
          printf 'register status %s\n' "$code"
          test "$code" = "201"

          code=$(curl -sS -o /tmp/session.json -w '%{http_code}' \
            -X POST "${api}/v1/sessions" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/smoke-login.json)
          printf 'session status %s\n' "$code"
          test "$code" = "202"
          challenge=$(jq -r .challenge_id /tmp/session.json)
          mail_id=$(curl -fsS 'http://127.0.0.1:8025/api/v1/search?query=to:ci-smoke@example.com' | jq -r '.messages[0].ID')
          otp=$(curl -fsS "http://127.0.0.1:8025/api/v1/message/$mail_id" | jq -r '.Text' | sed -n 's/.*Your code: \([0-9]\{6\}\).*/\1/p')
          echo "::add-mask::$otp"
          jq -n --arg challenge_id "$challenge" --arg code "$otp" '{challenge_id:$challenge_id,code:$code}' > /tmp/verify.json
          code=$(curl -sS -o /tmp/session.json -w '%{http_code}' -X POST "${api}/v1/sessions/verify" -H 'Content-Type: application/json' --data-binary @/tmp/verify.json)
          test "$code" = "201"
          token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' /tmp/session.json)
          test -n "$token"
          echo "::add-mask::$token"

          # A token signed by Identity must be accepted by the Gateway and routed to Catalog.
          code=$(curl -sS -o /tmp/track.json -w '%{http_code}' \
            -X POST "${api}/v1/tracks" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke","artist":"CI","size":4}')
          printf 'create track status %s\n' "$code"
          test "$code" = "201"

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop system under test
        if: always()
        run: docker compose down --volumes --remove-orphans

  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [platform, identity, catalog, social, gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run unit tests
        working-directory: backend
        run: make test TEST_PACKAGES='chimera/${{ matrix.module }}/...'

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit-${{ matrix.module }}
          path: backend/allure-results
          if-no-files-found: ignore

  integration:
    name: Integration tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [identity, catalog, social]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          cp .env.example .env
          E2E_ENV_OUTPUT=.env sh backend/scripts/e2e-secrets.sh

      - name: Start test stand
        working-directory: backend
        run: make stand-up

      - name: Run integration tests
        working-directory: backend
        run: make test-integration INTEGRATION_SERVICES=${{ matrix.service }}

      - name: Stop test stand
        if: always()
        working-directory: backend
        run: make stand-down

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration-${{ matrix.service }}
          path: backend/allure-results
          if-no-files-found: ignore

  e2e:
    name: Demo scenario
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_NEW_PASSWORD: ${{ secrets.E2E_NEW_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          cp .env.example .env
          E2E_ENV_OUTPUT=.env sh backend/scripts/e2e-secrets.sh

      - name: Run end-to-end demo
        working-directory: backend
        run: make test-e2e

      - name: Capture demo traffic
        if: ${{ !cancelled() }}
        working-directory: backend
        run: make demo-capture

      - name: Sanitize end-to-end diagnostics
        id: sanitize
        if: ${{ !cancelled() }}
        run: python3 backend/scripts/sanitize-auth-artifacts.py backend/e2e-out backend/allure-results

      - name: Upload end-to-end Allure results
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-allure-results
          path: backend/allure-results
          if-no-files-found: ignore

      - name: Upload traffic capture
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traffic
          path: backend/e2e-out
          if-no-files-found: ignore

  auth-e2e:
    name: Authentication BDD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_NEW_PASSWORD: ${{ secrets.E2E_NEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment
        run: cp .env.example .env
      - name: Test artifact sanitization
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s backend/scripts -p test_sanitize_auth_artifacts.py
      - name: Run authentication scenarios
        run: make -C backend test-auth-e2e
      - name: Verify perf authentication without load
        run: make -C backend test-auth-perf-compat
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ !cancelled() }}
        run: python3 backend/scripts/sanitize-auth-artifacts.py backend/auth-bdd backend/allure-results backend/e2e-out
      - name: Upload BDD and Allure reports
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-bdd-results
          path: |
            backend/auth-bdd
            backend/allure-results
            backend/e2e-out
          if-no-files-found: error
