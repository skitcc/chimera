      description: Ответ — переход на временную ссылку чтения. Неготовый трек не отдаётся.
      operationId: getTrackStream
      parameters:
      - description: Идентификатор трека
        format: uuid
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Временная ссылка в Location
          headers:
            Location:
              description: Временная ссылка на объект
              type: string
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Повтор уникальной пары, занятый email или неверный статус трека
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Аудио трека
      tags:
      - tracks
  /v1/users:
    get:
      description: Весь справочник по страницам. Подписчики и подписки — в `GET /v1/follows`.
      operationId: listUsers
      parameters:
      - default: 20
        description: Размер страницы. По умолчанию 20, больше 100 не принимается.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Курсор следующей страницы из прошлого ответа
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Страница профилей
          schema:
            $ref: '#/definitions/UserPage'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Пользователи
      tags:
      - users
    post:
      consumes:
      - application/json
      description: |-
        Создаёт аккаунт. Пароль не короче 8 символов.
        Токен здесь не выдаётся: после регистрации клиент открывает сессию через `POST /v1/sessions`.
      operationId: createUser
      parameters:
      - description: Аккаунт
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UserCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Аккаунт создан
          headers:
            Location:
              description: Адрес созданного ресурса
              type: string
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Повтор уникальной пары, занятый email или неверный статус трека
          schema:
            $ref: '#/definitions/Error'
        "429":
          description: Слишком частые регистрация или вход. Ответ не говорит, какая
            квота сработала.
          headers:
            Retry-After:
              description: Секунды до конца окна
              type: integer
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Регистрация
      tags:
      - users
  /v1/users/{userId}:
    delete:
      description: Только владелец аккаунта. Повтор по уже удалённому аккаунту — 401,
        сессии больше нет.
      operationId: deleteUser
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Аккаунт удалён
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Удалить аккаунт
      tags:
      - users
    get:
      description: Публичный профиль. Пароль в ответ не входит.
      operationId: getUser
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Профиль
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Профиль
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Меняются только переданные поля. Пустое тело не принимается.
        Пароль меняется только здесь. Только владелец аккаунта.
      operationId: updateUser
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      - description: Поля профиля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UserPatch'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль изменён
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Повтор уникальной пары, занятый email или неверный статус трека
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Частично изменить профиль
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Нужны и имя, и email. Пароль этой операцией не меняется. Только
        владелец аккаунта.
      operationId: replaceUser
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      - description: Профиль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UserReplace'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль заменён
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Повтор уникальной пары, занятый email или неверный статус трека
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Заменить профиль
      tags:
      - users
  /v1/users/{userId}/likes/{trackId}:
    delete:
      description: |-
        `userId` должен совпадать с владельцем токена. Повторное снятие тоже 204.
        404 только если нет самого трека.
      operationId: deleteLike
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      - description: Идентификатор трека
        format: uuid
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Лайка нет
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Снять отметку
      tags:
      - likes
    put:
      description: |-
        `userId` должен совпадать с владельцем токена. Только готовый трек.
        Идемпотентно: повтор той же пары снова 204.
      operationId: putLike
      parameters:
      - description: Идентификатор пользователя
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      - description: Идентификатор трека
        format: uuid
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Лайк есть
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Повтор уникальной пары, занятый email или неверный статус трека
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Отметить трек любимым
      tags:
      - likes
securityDefinitions:
  bearerAuth:
    description: 'Заголовок Authorization: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Вход
  name: sessions
- description: Аккаунты и профили
  name: users
- description: Каталог и публикация
  name: tracks
- description: Любимое
  name: likes
- description: Списки пользователя
  name: playlists
- description: Подписки на авторов
  name: follows
