basePath: /
definitions:
  v1.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/v1.UserResponse'
    type: object
  v1.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  v1.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  v1.PickDetailResponse:
    properties:
      generated_at:
        type: string
      id:
        type: string
      title:
        type: string
      tracks:
        items:
          $ref: '#/definitions/v1.PickTrackResponse'
        type: array
      user_id:
        type: string
    type: object
  v1.PickPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.PickResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  v1.PickPatchRequest:
    properties:
      title:
        type: string
    type: object
  v1.PickResponse:
    properties:
      generated_at:
        type: string
      id:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  v1.PickTrackResponse:
    properties:
      note:
        type: string
      position:
        type: integer
      track:
        $ref: '#/definitions/v1.TrackResponse'
    type: object
  v1.PlaylistPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.PlaylistResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  v1.PlaylistPatchRequest:
    properties:
      is_public:
        type: boolean
      title:
        type: string
    type: object
  v1.PlaylistReplaceRequest:
    properties:
      is_public:
        type: boolean
      title:
        type: string
    type: object
  v1.PlaylistResponse:
    properties:
      id:
        type: string
      is_public:
        type: boolean
      owner_id:
        type: string
      title:
        type: string
    type: object
  v1.PlaylistTrackAddRequest:
    properties:
      position:
        type: integer
      track_id:
        type: string
    type: object
  v1.PlaylistTrackMoveRequest:
    properties:
      position:
        type: integer
    type: object
  v1.PlaylistTrackPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.PlaylistTrackResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  v1.PlaylistTrackResponse:
    properties:
      position:
        type: integer
      track:
        $ref: '#/definitions/v1.TrackResponse'
    type: object
  v1.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  v1.TrackPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.TrackResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  v1.TrackPatchRequest:
    properties:
      artist:
        type: string
      title:
        type: string
    type: object
  v1.TrackResponse:
    properties:
      artist:
        type: string
      id:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  v1.TrackUploadInitRequest:
    properties:
      artist:
        type: string
      size:
        type: integer
      title:
        type: string
    type: object
  v1.TrackUploadInitResponse:
    properties:
      track:
        $ref: '#/definitions/v1.TrackResponse'
      upload_url:
        type: string
    type: object
  v1.TrackWriteRequest:
    properties:
      artist:
        type: string
      title:
        type: string
    type: object
  v1.UserPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/v1.UserResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  v1.UserPatchRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  v1.UserReplaceRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  v1.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  v1.UserWriteRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
  description: Music streaming backend
  title: Chimera API
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: Login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Login
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      operationId: register
      parameters:
      - description: Register
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /v1/me:
    delete:
      operationId: deleteCurrentUser
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current account
      tags:
      - users
    get:
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      operationId: updateCurrentUser
      parameters:
      - description: Profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UserPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current profile
      tags:
      - users
    put:
      consumes:
      - application/json
      operationId: replaceCurrentUser
      parameters:
      - description: Profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UserReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace current profile
      tags:
      - users
  /v1/me/following:
    get:
      operationId: listMyFollowing
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UserPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users followed by the current user
      tags:
      - follows
  /v1/me/likes:
    get:
      operationId: listMyLikes
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.TrackPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My liked tracks
      tags:
      - tracks
  /v1/me/picks:
    get:
      operationId: listMyPicks
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PickPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List current user's generated picks
      tags:
      - picks
    post:
      description: Persists up to 20 randomly selected ready tracks.
      operationId: generatePick
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.PickDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate a temporary random pick
      tags:
      - picks
  /v1/me/picks/{pickId}:
    delete:
      operationId: deletePick
      parameters:
      - description: Pick ID
        in: path
        name: pickId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a generated pick
      tags:
      - picks
    get:
      operationId: getMyPick
      parameters:
      - description: Pick ID
        in: path
        name: pickId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PickDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one generated pick
      tags:
      - picks
    patch:
      consumes:
      - application/json
      operationId: renamePick
      parameters:
      - description: Pick ID
        in: path
        name: pickId
        required: true
        type: string
      - description: Pick fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PickPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PickResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename a generated pick
      tags:
      - picks
  /v1/me/playlists:
    get:
      operationId: listMyPlaylists
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List current user's playlists
      tags:
      - playlists
  /v1/me/tracks:
    get:
      description: All tracks uploaded by the current user, including drafts.
      operationId: listMyTracks
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.TrackPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My uploaded tracks
      tags:
      - tracks
  /v1/playlists:
    post:
      consumes:
      - application/json
      operationId: createPlaylist
      parameters:
      - description: Playlist
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PlaylistReplaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a playlist
      tags:
      - playlists
  /v1/playlists/{playlistId}:
    delete:
      operationId: deletePlaylist
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a playlist
      tags:
      - playlists
    get:
      operationId: getPlaylist
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get a visible playlist
      tags:
      - playlists
    patch:
      consumes:
      - application/json
      operationId: updatePlaylist
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Playlist fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PlaylistPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update playlist fields
      tags:
      - playlists
    put:
      consumes:
      - application/json
      operationId: replacePlaylist
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Playlist
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PlaylistReplaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a playlist
      tags:
      - playlists
  /v1/playlists/{playlistId}/tracks:
    get:
      operationId: listPlaylistTracks
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistTrackPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: List tracks in a visible playlist
      tags:
      - playlists
    post:
      consumes:
      - application/json
      operationId: addPlaylistTrack
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Track and position
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PlaylistTrackAddRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.PlaylistTrackResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a track to a playlist
      tags:
      - playlists
  /v1/playlists/{playlistId}/tracks/{trackId}:
    delete:
      operationId: removePlaylistTrack
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Track ID
        in: path
        name: trackId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a track from a playlist
      tags:
      - playlists
    patch:
      consumes:
      - application/json
      operationId: movePlaylistTrack
      parameters:
      - description: Playlist ID
        in: path
        name: playlistId
        required: true
        type: string
      - description: Track ID
        in: path
        name: trackId
        required: true
        type: string
      - description: New position
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.PlaylistTrackMoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlaylistTrackResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
