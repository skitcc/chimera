basePath: /
definitions:
  Error:
    properties:
      code:
        enum:
        - invalid
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - too_many_requests
        - internal
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
  Follow:
    properties:
      created_at:
        example: "2026-09-25T09:00:00Z"
        format: date-time
        type: string
      follower:
        $ref: '#/definitions/User'
      following:
        $ref: '#/definitions/User'
    required:
    - created_at
    - follower
    - following
    type: object
  FollowPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Follow'
        type: array
      limit:
        example: 20
        type: integer
      next_cursor:
        example: "20"
        type: string
    required:
    - items
    - limit
    type: object
  FollowsCreate:
    properties:
      follower_id:
        description: Кто подписывается. Должен совпадать с владельцем токена.
        example: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        format: uuid
        type: string
      following_ids:
        description: На кого подписаться
        items:
          format: uuid
          type: string
        maxItems: 100
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - follower_id
    - following_ids
    type: object
  Playlist:
    properties:
      id:
        example: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
        format: uuid
        type: string
      is_public:
        example: true
        type: boolean
      owner_id:
        example: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        format: uuid
        type: string
      title:
        example: Ночные
        type: string
    required:
    - id
    - is_public
    - owner_id
    - title
    type: object
  PlaylistPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Playlist'
        type: array
      limit:
        example: 20
        type: integer
      next_cursor:
        type: string
    required:
    - items
    - limit
    type: object
  PlaylistPatch:
    properties:
      is_public:
        example: true
        type: boolean
      title:
        minLength: 1
        type: string
    type: object
  PlaylistReplace:
    properties:
      is_public:
        example: false
        type: boolean
      title:
        example: Ночные
        minLength: 1
        type: string
    required:
    - is_public
    - title
    type: object
  PlaylistTrack:
    properties:
      position:
        example: 1
        minimum: 0
        type: integer
      track:
        $ref: '#/definitions/Track'
    required:
    - position
    - track
    type: object
  PlaylistTrackCreate:
    properties:
      position:
        example: 1
        minimum: 0
        type: integer
      track_id:
        example: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
        format: uuid
        type: string
    required:
    - position
    - track_id
    type: object
  PlaylistTrackPage:
    properties:
      items:
        items:
          $ref: '#/definitions/PlaylistTrack'
        type: array
      limit:
        example: 20
        type: integer
      next_cursor:
        type: string
    required:
    - items
    - limit
    type: object
  PlaylistTrackPatch:
    properties:
      position:
        example: 2
        minimum: 0
        type: integer
    required:
    - position
    type: object
  Session:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        type: string
      user_id:
        description: Владелец токена. Подставляется в пути и фильтры вместо текущего
          пользователя.
        example: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        format: uuid
        type: string
    required:
    - token
    - user_id
    type: object
  SessionCreate:
    properties:
      email:
        example: ada@example.com
        format: email
        type: string
      password:
        example: long-enough
        type: string
    required:
    - email
    - password
    type: object
  Track:
    properties:
      artist:
        description: Строка для поиска, не аккаунт
        example: Ada
        type: string
      id:
        example: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
        format: uuid
        type: string
      size_bytes:
        example: 3200000
        format: int64
        minimum: 0
        type: integer
      status:
        enum:
        - pending
        - processing
        - ready
        example: ready
        type: string
      title:
        example: Night Drive
        type: string
      user_id:
        example: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        format: uuid
        type: string
    required:
    - artist
    - id
    - size_bytes
    - status
    - title
    - user_id
    type: object
  TrackCreate:
    properties:
      artist:
        example: Ada
        type: string
      size:
        description: Размер файла в байтах
        example: 3200000
        format: int64
        minimum: 1
        type: integer
      title:
        example: Night Drive
        minLength: 1
        type: string
    required:
    - artist
    - size
    - title
    type: object
  TrackPage:
    properties:
      items:
        items:
          $ref: '#/definitions/Track'
        type: array
      limit:
        example: 20
        type: integer
      next_cursor:
        example: "20"
        type: string
    required:
    - items
    - limit
    type: object
  TrackPatch:
    properties:
      artist:
        type: string
      status:
        description: Единственный переход, который задаёт клиент, — публикация загруженного
          файла.
        enum:
        - ready
        type: string
      title:
        example: Night Drive (demo)
        minLength: 1
        type: string
    type: object
  TrackReplace:
    properties:
      artist:
        example: Ada
        type: string
      title:
        example: Night Drive
        minLength: 1
        type: string
    required:
    - artist
    - title
    type: object
  TrackUpload:
    properties:
      track:
        $ref: '#/definitions/Track'
      upload_url:
        example: https://storage.example/music-raw/7c2f3d4b-8e5a-4b2c-ad9f-222222222222.mp3?X-Amz-Signature=example
        format: uri
        type: string
    required:
    - track
    - upload_url
    type: object
  User:
    properties:
      email:
        example: ada@example.com
        format: email
        type: string
      id:
        example: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        format: uuid
        type: string
      name:
        example: Ada
        type: string
    required:
    - email
    - id
    - name
    type: object
  UserCreate:
    properties:
      email:
        example: ada@example.com
        format: email
        type: string
      name:
        example: Ada
        type: string
      password:
        example: long-enough
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  UserPage:
    properties:
      items:
        items:
          $ref: '#/definitions/User'
        type: array
      limit:
        example: 20
        type: integer
      next_cursor:
        example: "20"
        type: string
    required:
    - items
    - limit
    type: object
  UserPatch:
    properties:
      email:
        format: email
        type: string
      name:
        example: Ada Lovelace
        type: string
      password:
        description: Если поле передано, пароль заменяется. Иначе остаётся прежним.
        minLength: 8
        type: string
    type: object
  UserReplace:
    properties:
      email:
        example: ada@example.com
        format: email
        type: string
      name:
        example: Ada Lovelace
        type: string
    required:
    - email
    - name
    type: object
info:
  contact: {}
  title: Sound Chimera API
  version: 1.0.0
paths:
  /v1/follows:
    delete:
      description: |-
        Снимает подписки `follower_id` на всех из `following_id`.
        `follower_id` должен совпадать с владельцем токена, иначе 403.
        Список передаётся в query, а не в теле: тело у DELETE многие клиенты и прокси отбрасывают.

        - Атомарно и идемпотентно: отсутствующие подписки и несуществующие авторы пропускаются, повтор снова 204.
        - Без `following_id` — 400: запрос без списка не снимает все подписки.
        - Повтор внутри списка или больше 100 идентификаторов — 400.

        Для одного автора — `DELETE /v1/follows/{followerId}/{followingId}`.
      operationId: deleteFollows
      parameters:
      - description: Чьи подписки снимаются. Должен совпадать с владельцем токена.
        format: uuid
        in: query
        name: follower_id
        required: true
        type: string
      - collectionFormat: multi
        description: От кого отписаться. Параметр повторяется на каждого автора —
          `?following_id=a&following_id=b`.
        in: query
        items:
          type: string
        name: following_id
        required: true
        type: array
      produces:
      - application/json
      responses:
        "204":
          description: Подписок на авторов из списка нет
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Отписаться от нескольких авторов
      tags:
      - follows
    get:
      description: |-
        Нужен хотя бы один фильтр, иначе 400.

        - `follower_id` — на кого подписан пользователь.
        - `following_id` — кто подписан на пользователя.
        - Оба сразу — есть ли подписка у этой пары: страница из одной записи или пустая.

        Если указанного пользователя нет — 404.
      operationId: listFollows
      parameters:
      - description: Только подписки этого пользователя
        format: uuid
        in: query
        name: follower_id
        type: string
      - description: Только подписки на этого пользователя
        format: uuid
        in: query
        name: following_id
        type: string
      - default: 20
        description: Размер страницы. По умолчанию 20, больше 100 не принимается.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Курсор следующей страницы из прошлого ответа
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Страница подписок
          schema:
            $ref: '#/definitions/FollowPage'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Подписки
      tags:
      - follows
    post:
      consumes:
      - application/json
      description: |-
        Создаёт подписки `follower_id` на всех из `following_ids`.
        `follower_id` должен совпадать с владельцем токена, иначе 403.

        - Атомарно: если хоть одного автора нет — 404, ничего не меняется.
        - Идемпотентно: уже существующие подписки пропускаются, повтор запроса снова 204.
        - Пустой список, повтор внутри списка, `follower_id` в списке или больше 100 идентификаторов — 400.

        Для одного автора — `PUT /v1/follows/{followerId}/{followingId}`.
      operationId: createFollows
      parameters:
      - description: Подписчик и авторы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/FollowsCreate'
      produces:
      - application/json
      responses:
        "204":
          description: Подписки на всех из списка есть
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Подписаться на нескольких авторов
      tags:
      - follows
  /v1/follows/{followerId}/{followingId}:
    delete:
      description: |-
        `followerId` должен совпадать с владельцем токена, иначе 403.
        Идемпотентно: повторное снятие снова 204.
      operationId: deleteFollow
      parameters:
      - description: Кто подписывается
        format: uuid
        in: path
        name: followerId
        required: true
        type: string
      - description: На кого подписываются
        format: uuid
        in: path
        name: followingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Подписки нет
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Отписаться от автора
      tags:
      - follows
    get:
      description: 200 — подписка есть, 404 — нет её или нет одного из пользователей.
      operationId: getFollow
      parameters:
      - description: Кто подписывается
        format: uuid
        in: path
        name: followerId
        required: true
        type: string
      - description: На кого подписываются
        format: uuid
        in: path
        name: followingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Подписка
          schema:
            $ref: '#/definitions/Follow'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      summary: Подписка пары
      tags:
      - follows
    put:
      description: |-
        `followerId` должен совпадать с владельцем токена, иначе 403.
        Идемпотентно: повтор той же пары снова 204. На себя подписаться нельзя — 400.
      operationId: putFollow
      parameters:
      - description: Кто подписывается
        format: uuid
        in: path
        name: followerId
        required: true
        type: string
      - description: На кого подписываются
        format: uuid
        in: path
        name: followingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Подписка есть
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Подписаться на автора
      tags:
      - follows
  /v1/playlists:
    get:
      description: |-
        Одна коллекция для ленты и плейлистов пользователя, как `GET /v1/tracks`. Фильтры складываются через И.

        - Без фильтров — лента всех публичных плейлистов.
        - `owner_id` — плейлисты пользователя. Если пользователя нет — 404.
        - `is_public` — по умолчанию только публичные. Если `owner_id` совпадает с владельцем токена,
        по умолчанию видны и скрытые. `is_public=false` для чужих плейлистов — 403.

        Если Authorization передан, токен должен быть верным.
      operationId: listPlaylists
      parameters:
      - description: Владелец плейлистов
        format: uuid
        in: query
        name: owner_id
        type: string
      - description: Видимость плейлиста. `false` — только для своих плейлистов.
        in: query
        name: is_public
        type: boolean
      - default: 20
        description: Размер страницы. По умолчанию 20, больше 100 не принимается.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Курсор следующей страницы из прошлого ответа
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Страница плейлистов
          schema:
            $ref: '#/definitions/PlaylistPage'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Плейлисты
      tags:
      - playlists
    post:
      consumes:
      - application/json
      description: |-
        Владелец — владелец токена. Нужны название и флаг публичности.
        Повтор запроса создаёт ещё один плейлист.
      operationId: createPlaylist
      parameters:
      - description: Название и видимость
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PlaylistReplace'
      produces:
      - application/json
      responses:
        "201":
          description: Плейлист создан
          headers:
            Location:
              description: Адрес созданного ресурса
              type: string
          schema:
            $ref: '#/definitions/Playlist'
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Создать плейлист
      tags:
      - playlists
  /v1/playlists/{playlistId}:
    delete:
      description: Только владелец. Повтор по уже удалённому плейлисту — 404.
      operationId: deletePlaylist
      parameters:
      - description: Идентификатор плейлиста
        format: uuid
        in: path
        name: playlistId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Плейлист удалён
        "400":
          description: Неверное тело, параметр или пустое частичное обновление
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Токена нет или он неверен. При входе сюда же попадает неверный
            пароль.
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Токен верный, но ресурс принадлежит другому пользователю
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Ресурс не найден или скрыт от этого клиента
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Сбой сервера. Клиенту не отдаются детали.
          schema:
            $ref: '#/definitions/Error'
      security:
      - bearerAuth: []
      summary: Удалить плейлист
