services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera
      POSTGRES_DB: chimera
    ports:
      - "5432:5432"
    volumes:
      - chimera-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimera -d chimera"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  chimera-pg:
