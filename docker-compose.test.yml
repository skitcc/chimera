name: chimera-stand

services:
  postgres:
    image: ${POSTGRES_TEST_IMAGE:-postgres:17-alpine}
    container_name: chimera-stand-postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_TEST_PORT:-54329}:5432"
    volumes:
      - chimera-stand-pg:/var/lib/postgresql/data
      - ./backend/scripts/stand-init.sh:/docker-entrypoint-initdb.d/01-template.sh:ro
      - ./backend/internal/infra/adapters/postgres/schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: ${POSTGRES_TEST_HEALTH_INTERVAL:-2s}
      timeout: ${POSTGRES_TEST_HEALTH_TIMEOUT:-5s}
      retries: ${POSTGRES_TEST_HEALTH_RETRIES:-30}
      start_period: 10s

  rustfs:
    image: ${MINIO_IMAGE:-rustfs/rustfs:latest}
    container_name: chimera-stand-rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_CORS_ALLOWED_ORIGINS: "${MINIO_API_CORS_ALLOW_ORIGIN:-*}"
    ports:
      - "${STAND_MINIO_PORT:-9002}:9000"
    volumes:
      - chimera-stand-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  default:
    name: chimera-stand

volumes:
  chimera-stand-pg:
    name: chimera-stand-pg
  chimera-stand-objects:
    name: chimera-stand-objects
