# One primary for writes and two hot standbys for reads, one database and role per
# service (postgres-init). The replicas stream WAL from the primary through their own slots.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: metrics
      port: 9187
      targetPort: metrics
---
# kube-proxy spreads read connections over the replicas.
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
spec:
  selector:
    app.kubernetes.io/name: postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/primary.sh"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: chimera
            - name: POSTGRES_DB
              value: postgres
            # A subdirectory: the volume root may hold lost+found, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: POSTGRES_PASSWORD}
            - name: POSTGRES_REPLICATION_USER
              value: replicator
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: POSTGRES_REPLICATION_PASSWORD}
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: IDENTITY_DB_PASSWORD}
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: CATALOG_DB_PASSWORD}
            - name: SOCIAL_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: SOCIAL_DB_PASSWORD}
            - name: IDENTITY_DB_READ_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: IDENTITY_DB_READ_PASSWORD}
            - name: CATALOG_DB_READ_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: CATALOG_DB_READ_PASSWORD}
            - name: SOCIAL_DB_READ_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: SOCIAL_DB_READ_PASSWORD}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent
          args: ["--extend.query-path=/queries/queries.yaml"]
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: 127.0.0.1:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: chimera
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: exporter-queries
              mountPath: /queries
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: scripts
          configMap:
            name: postgres-scripts
        - name: exporter-queries
          configMap:
            name: postgres-exporter-queries
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
spec:
  serviceName: postgres-replica
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-replica
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgres-replica
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/replica.sh"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PRIMARY_HOST
              value: postgres
            - name: POSTGRES_REPLICATION_USER
              value: replicator
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: POSTGRES_REPLICATION_PASSWORD}
          # A standby accepts connections only after it reaches a consistent state.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U chimera -d postgres"]
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U chimera -d postgres"]
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U chimera -d postgres"]
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: scripts
          configMap:
            name: postgres-scripts
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
