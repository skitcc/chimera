# Observability: traces (services -> otel-collector -> Tempo), logs (promtail ->
# Loki), metrics (Prometheus scrapes each pod), and Grafana on /monitoring of the edge.
# The stores keep data in emptyDir: a restart empties them, which a demo stand accepts.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.103.0
          args: [--config=/etc/otelcol/otel-collector.yml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 10001}
      containers:
        - name: tempo
          image: grafana/tempo:2.7.1
          args: [-config.file=/etc/tempo/tempo.yml]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 10001}
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki.yml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
# promtail discovers the pods of its namespace through the API, so it may only list them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args: [-config.file=/etc/promtail/promtail.yml]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          # The kubelet writes the logs as root.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: positions, mountPath: /run/promtail}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: positions
          hostPath: {path: /var/lib/chimera-promtail, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - {name: metrics, port: 9308, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args: ["--kafka.server=kafka:9092"]
          ports:
            - {name: metrics, containerPort: 9308}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef: {name: grafana-config}
          env:
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef: {name: edge-config, key: WEB_ORIGIN}
            # The edge proxies /monitoring/ with the prefix kept.
            - name: GF_SERVER_ROOT_URL
              value: $(WEB_ORIGIN)/monitoring/
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: GRAFANA_ADMIN_PASSWORD}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboards-provider
          configMap: {name: grafana-dashboards-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
