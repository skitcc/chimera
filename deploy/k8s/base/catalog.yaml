# Catalog: tracks and their files. Publishes TrackDeleted, consumes UserDeleted.
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
---
# One A record per ready pod: gRPC clients resolve dns:///catalog-headless and
# balance round robin over the pods; Prometheus scrapes each pod through it.
apiVersion: v1
kind: Service
metadata:
  name: catalog-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: catalog
      containers:
        - name: catalog
          image: chimera/catalog:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef: {name: service-runtime}
            - configMapRef: {name: catalog-config}
          env:
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: CATALOG_DB_PASSWORD}
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog?sslmode=disable
            # Reads that tolerate replication lag go to the hot standbys.
            - name: DB_READ_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: CATALOG_DB_READ_PASSWORD}
            - name: DATABASE_READ_URL
              value: postgres://catalog_ro:$(DB_READ_PASSWORD)@postgres-replica:5432/catalog?sslmode=disable
            - name: S3_PRESIGN_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: edge-config, key: S3_PRESIGN_ENDPOINT}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: S3_ACCESS_KEY}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: S3_SECRET_KEY}
          readinessProbe:
            grpc: {port: 9090}
            periodSeconds: 5
          # The server listens only after Postgres (and S3) answer; until then
          # only the startup probe runs, so a slow dependency never kills the pod.
          startupProbe:
            grpc: {port: 9090, service: chimera.liveness}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            grpc: {port: 9090, service: chimera.liveness}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
