apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: edge
      containers:
        - name: edge
          image: chimera/edge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef: {name: edge-upstreams}
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: ADMIN_PASSWORD}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
---
# The same SPA built for /mirror; its API calls go to /mirror/api on the edge.
apiVersion: v1
kind: Service
metadata:
  name: mirror
spec:
  selector:
    app.kubernetes.io/name: mirror
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirror
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mirror
          image: chimera/mirror:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: {path: /mirror/, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
spec:
  selector:
    app.kubernetes.io/name: adminer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: adminer
          image: adminer:4
          ports:
            - name: http
              containerPort: 8080
          env:
            # Writes go to the primary; postgres-replica serves read-only sessions.
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
