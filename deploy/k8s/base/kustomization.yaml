apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chimera
labels:
  - pairs:
      app.kubernetes.io/part-of: chimera
resources:
  - namespace.yaml
  - ../../postgres
  - ../../kafka
  - postgres.yaml
  - rustfs.yaml
  - kafka.yaml
  - identity.yaml
  - mailpit.yaml
  - catalog.yaml
  - social.yaml
  - gateway.yaml
  - web.yaml
  - edge.yaml
  - monitoring.yaml
  - ../../../monitoring
configMapGenerator:
  # Public addresses of the edge. Overlays replace these placeholders.
  - name: edge-config
    literals:
      - WEB_ORIGIN=http://chimera.example
      - S3_PRESIGN_ENDPOINT=http://s3.chimera.example
      - STREAM_HOST=s3.chimera.example
      - TRUSTED_PROXIES=
  - name: edge-upstreams
    literals:
      - API_UPSTREAM=gateway:8080
      - WEB_UPSTREAM=web:80
      - MIRROR_UPSTREAM=mirror:80
      - GRAFANA_UPSTREAM=grafana:3000
      - ADMINER_UPSTREAM=adminer:8080
      - OTEL_EXPORTER_ENDPOINT=otel-collector:4317
      - ADMIN_USER=admin
  - name: grafana-config
    literals:
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
  # Settings every gRPC service reads. Environment-specific values live in overlays.
  - name: service-runtime
    literals:
      - APP_MODE=production
      - LOG_LEVEL=info
      - HEALTH_CHECK_INTERVAL=10s
      - HEALTH_CHECK_TIMEOUT=3s
      - GRPC_ADDR=:9090
      - SHUTDOWN_TIMEOUT=10s
      - GRPC_MAX_CONNECTION_AGE=30s
      - METRICS_ADDR=:9464
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - POSTGRES_MIN_CONNS=2
      - POSTGRES_MAX_CONNS=10
      - POSTGRES_MAX_CONN_IDLE=5m
      - POSTGRES_MAX_CONN_LIFETIME=30m
      - POSTGRES_STATEMENT_TIMEOUT=5s
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_PRODUCE_TIMEOUT=10s
      - KAFKA_RETRY_MAX_ATTEMPTS=8
      - KAFKA_RETRY_BACKOFF=200ms
      - KAFKA_RETRY_MAX_BACKOFF=30s
      - OUTBOX_POLL_INTERVAL=500ms
      - OUTBOX_BATCH_SIZE=100
  - name: identity-config
    literals:
      - JWT_PRIVATE_KEY_FILE=/keys/jwt.pem
      - JWT_TTL=24h
      - SMTP_ADDR=mailpit:1025
      - SMTP_REQUIRE_TLS=false
      - AUTH_SECURITY_ENABLED=true
  - name: catalog-config
    literals:
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET=music-raw
      - S3_REGION=us-east-1
      - S3_PRESIGN_TTL=15m
      - S3_TIMEOUT=5s
      - TRACK_MAX_BYTES=104857600
  - name: social-config
    literals:
      - IDENTITY_GRPC_ADDR=dns:///identity-headless:9090
      - CATALOG_GRPC_ADDR=dns:///catalog-headless:9090
      - GRPC_CLIENT_TIMEOUT=3s
      - GRPC_RETRY_MAX_ATTEMPTS=3
      - GRPC_RETRY_BACKOFF=50ms
  - name: gateway-config
    literals:
      - APP_MODE=production
      - LOG_LEVEL=info
      - HEALTH_CHECK_INTERVAL=10s
      - HEALTH_CHECK_TIMEOUT=3s
      - HTTP_ADDR=:8080
      - HTTP_SHUTDOWN_TIMEOUT=3s
      - HTTP_READ_HEADER_TIMEOUT=5s
      - HTTP_WRITE_TIMEOUT=15s
      - JWT_PUBLIC_KEY_FILE=/keys/jwt.pub
      - AUTH_SECURITY_ENABLED=true
      # Each of the 3 Gateway pods counts on its own: 7 x 3 is about the former 20.
      - AUTH_RATE_LIMIT=7
      - AUTH_RATE_WINDOW=1m
      - IDENTITY_GRPC_ADDR=dns:///identity-headless:9090
      - CATALOG_GRPC_ADDR=dns:///catalog-headless:9090
      - SOCIAL_GRPC_ADDR=dns:///social-headless:9090
      - GRPC_CLIENT_TIMEOUT=3s
      - GRPC_RETRY_MAX_ATTEMPTS=3
      - GRPC_RETRY_BACKOFF=50ms
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
