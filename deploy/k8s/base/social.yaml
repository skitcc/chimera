# Social: likes, follows, playlists. Consumes UserDeleted and TrackDeleted.
apiVersion: v1
kind: Service
metadata:
  name: social
spec:
  selector:
    app.kubernetes.io/name: social
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: social
          image: chimera/social:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef: {name: service-runtime}
            - configMapRef: {name: social-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: chimera-secrets, key: SOCIAL_DB_PASSWORD}
            - name: DATABASE_URL
              value: postgres://social:$(DB_PASSWORD)@postgres:5432/social?sslmode=disable
          readinessProbe:
            grpc: {port: 9090}
            periodSeconds: 5
          # The server listens only after Postgres (and S3) answer; until then
          # only the startup probe runs, so a slow dependency never kills the pod.
          startupProbe:
            grpc: {port: 9090, service: chimera.liveness}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            grpc: {port: 9090, service: chimera.liveness}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
