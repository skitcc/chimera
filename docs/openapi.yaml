        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [playlists]
      operationId: deletePlaylistTrack
      summary: Убрать трек из плейлиста
      description: Сам плейлист остаётся. Только владелец плейлиста.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
        - $ref: '#/components/parameters/trackId'
      responses:
        '204':
          description: Трек убран из списка
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/picks:
    get:
      tags: [picks]
      operationId: listPicks
      summary: Подборки пользователя
      description: |
        `user_id` обязателен и должен совпадать с владельцем токена, иначе 403.
        Новые генерации не затирают старые.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdQueryRequired'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница подборок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickPage'
              example:
                items:
                  - id: a05c607e-b18d-4e5f-d02c-555555555555
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: По лайкам
                    generated_at: '2026-09-25T09:00:00Z'
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [picks]
      operationId: createPick
      summary: Создать подборку
      description: |
        Система собирает новую подборку для владельца токена по лайкам, подпискам
        и артистам этих треков. Состав клиент не передаёт, тела у запроса нет.
      x-implemented: false
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Подборка создана
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickDetail'
              example:
                id: a05c607e-b18d-4e5f-d02c-555555555555
                user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: По лайкам
                generated_at: '2026-09-25T09:00:00Z'
                tracks:
                  - position: 1
                    note: like
                    track:
                      id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                      user_id: 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                      title: Night Drive
                      artist: Ada
                      status: ready
                      size_bytes: 3200000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/picks/{pickId}:
    get:
      tags: [picks]
      operationId: getPick
      summary: Подборка с треками
      description: Подборка и состав с `position` и `note`. Чужая подборка — 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pickId'
      responses:
        '200':
          description: Подборка и почему выбран каждый трек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickDetail'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [picks]
      operationId: updatePick
      summary: Изменить название подборки
      description: Меняется только название. Состав остаётся за системой. Чужая подборка — 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pickId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickPatch'
            example:
              title: Ночная
      responses:
        '200':
          description: Название изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pick'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [picks]
      operationId: deletePick
      summary: Удалить подборку
      description: Только своя подборка. Повтор по уже удалённой — 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pickId'
      responses:
        '204':
          description: Подборка удалена
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Заголовок Authorization: Bearer <token>"
  headers:
    Location:
      description: Адрес созданного ресурса
      schema:
        type: string
        format: uri-reference
      example: /v1/tracks/7c2f3d4b-8e5a-4b2c-ad9f-222222222222
  parameters:
    userId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid
    followerId:
      name: followerId
      in: path
      required: true
      description: Кто подписывается
      schema:
        type: string
        format: uuid
    followingId:
      name: followingId
      in: path
      required: true
      description: На кого подписываются
      schema:
        type: string
        format: uuid
    followerIdQuery:
      name: follower_id
      in: query
      required: false
      description: Только подписки этого пользователя
      schema:
        type: string
        format: uuid
    followerIdQueryRequired:
      name: follower_id
      in: query
      required: true
      description: Чьи подписки снимаются. Должен совпадать с владельцем токена.
      schema:
        type: string
        format: uuid
    followingIdQuery:
      name: following_id
      in: query
      required: false
      description: Только подписки на этого пользователя
      schema:
        type: string
        format: uuid
    followingIds:
      name: following_id
      in: query
      required: true
      description: От кого отписаться. Параметр повторяется на каждого автора — `?following_id=a&following_id=b`.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      description: Идентификатор трека
      schema:
        type: string
        format: uuid
    playlistId:
      name: playlistId
      in: path
      required: true
      description: Идентификатор плейлиста
      schema:
        type: string
        format: uuid
    pickId:
      name: pickId
      in: path
      required: true
      description: Идентификатор подборки
      schema:
        type: string
        format: uuid
    userIdQuery:
      name: user_id
      in: query
      required: false
      description: Автор треков
      schema:
        type: string
        format: uuid
    userIdQueryRequired:
      name: user_id
      in: query
      required: true
      description: Чьи подборки. Должен совпадать с владельцем токена.
      schema:
        type: string
        format: uuid
    ownerId:
      name: owner_id
      in: query
      required: false
      description: Владелец плейлистов
      schema:
        type: string
        format: uuid
    isPublic:
      name: is_public
      in: query
      required: false
      description: Видимость плейлиста. `false` — только для своих плейлистов.
      schema:
        type: boolean
    likedBy:
      name: liked_by
      in: query
      required: false
      description: Только треки, отмеченные любимыми этим пользователем. Должен совпадать с владельцем токена.
      schema:
        type: string
        format: uuid
    artist:
      name: artist
      in: query
      required: false
      description: Точное имя артиста
      schema:
        type: string
      example: Ada
    status:
      name: status
      in: query
      required: false
      description: Статус трека. Кроме `ready` — только для своих треков.
      schema:
        type: string
        enum: [pending, processing, ready]
    limit:
      name: limit
      in: query
      required: false
      description: Размер страницы. По умолчанию 20, больше 100 не принимается.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы из прошлого ответа
      schema:
        type: string
  responses:
    Invalid:
      description: Неверное тело, параметр или пустое частичное обновление
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid
            message: title is required
    Unauthorized:
      description: Токена нет или он неверен. При входе сюда же попадает неверный пароль.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: missing token
    Forbidden:
      description: Токен верный, но ресурс принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: not allowed
    NotFound:
      description: Ресурс не найден или скрыт от этого клиента
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: track not found
    Conflict:
      description: Повтор уникальной пары, занятый email или неверный статус трека
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: track is not ready
    TooManyRequests:
      description: Слишком частые регистрация или вход. Ответ не говорит, какая квота сработала.
      headers:
        Retry-After:
          description: Секунды до конца окна
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: too_many_requests
            message: slow down
    Internal:
      description: Сбой сервера. Клиенту не отдаются детали.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal
            message: internal error
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - too_many_requests
            - internal
        message:
          type: string
    SessionCreate:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Session:
      type: object
      required: [token, user_id]
      properties:
        token:
          type: string
        user_id:
          type: string
          format: uuid
          description: Владелец токена. Подставляется в пути и фильтры вместо текущего пользователя.
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    UserReplace:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    UserPatch:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
          description: Если поле передано, пароль заменяется. Иначе остаётся прежним.
    Follow:
      type: object
      required: [follower, following, created_at]
      properties:
        follower:
          $ref: '#/components/schemas/User'
        following:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
    FollowPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Follow'
        next_cursor:
          type: string
        limit:
          type: integer
    FollowsCreate:
      type: object
      required: [follower_id, following_ids]
      properties:
        follower_id:
          type: string
          format: uuid
          description: Кто подписывается. Должен совпадать с владельцем токена.
        following_ids:
          type: array
          description: На кого подписаться
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    UserPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
        limit:
          type: integer
    Track:
      type: object
      required: [id, user_id, title, artist, status, size_bytes]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
          description: Строка для поиска, не аккаунт
        status:
          type: string
          enum: [pending, processing, ready]
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    TrackCreate:
      type: object
      required: [title, artist, size]
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
          description: Размер файла в байтах
    TrackReplace:
      type: object
      required: [title, artist]
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
    TrackPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
        status:
          type: string
          enum: [ready]
          description: Единственный переход, который задаёт клиент, — публикация загруженного файла.
    TrackUpload:
      type: object
      required: [track, upload_url]
      properties:
        track:
          $ref: '#/components/schemas/Track'
        upload_url:
          type: string
          format: uri
    TrackPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        next_cursor:
          type: string
        limit:
          type: integer
    Playlist:
      type: object
      required: [id, owner_id, title, is_public]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        is_public:
          type: boolean
    PlaylistReplace:
      type: object
      required: [title, is_public]
      properties:
        title:
          type: string
          minLength: 1
        is_public:
          type: boolean
    PlaylistPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        is_public:
          type: boolean
    PlaylistPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        next_cursor:
          type: string
        limit:
          type: integer
    PlaylistTrack:
      type: object
      required: [position, track]
      properties:
        position:
          type: integer
          minimum: 0
        track:
          $ref: '#/components/schemas/Track'
    PlaylistTrackCreate:
      type: object
      required: [track_id, position]
      properties:
        track_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
    PlaylistTrackPatch:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0
    PlaylistTrackPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistTrack'
        next_cursor:
          type: string
        limit:
          type: integer
    Pick:
      type: object
      required: [id, user_id, title, generated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Кому собрана подборка
        title:
          type: string
        generated_at:
          type: string
          format: date-time
    PickPatch:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    PickTrack:
      type: object
      required: [position, note, track]
      properties:
        position:
          type: integer
          minimum: 0
        note:
          type: string
          description: Почему система выбрала трек. Не описание файла.
        track:
          $ref: '#/components/schemas/Track'
    PickDetail:
      allOf:
        - $ref: '#/components/schemas/Pick'
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: '#/components/schemas/PickTrack'
    PickPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pick'
        next_cursor:
          type: string
        limit:
          type: integer

security:
  - bearerAuth: []
