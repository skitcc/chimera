components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Заголовок Authorization: Bearer <token>"
  parameters:
    userId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      description: Идентификатор трека
      schema:
        type: string
        format: uuid
    playlistId:
      name: playlistId
      in: path
      required: true
      description: Идентификатор плейлиста
      schema:
        type: string
        format: uuid
    pickId:
      name: pickId
      in: path
      required: true
      description: Идентификатор подборки
      schema:
        type: string
        format: uuid
    artist:
      name: artist
      in: query
      required: false
      description: Точное имя артиста
      schema:
        type: string
      example: Ada
    limit:
      name: limit
      in: query
      required: false
      description: Размер страницы. По умолчанию 20, больше 100 не принимается.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursor:
      name: cursor
      in: query
      required: false
      description: Курсор следующей страницы из прошлого ответа
      schema:
        type: string
  responses:
    Invalid:
      description: Неверное тело, параметр или пустое частичное обновление
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid
            message: title is required
    Unauthorized:
      description: Токена нет или он неверен. Для входа сюда же попадает неверный пароль.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: missing token
    Forbidden:
      description: Токен верный, но действие доступно только владельцу
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: not allowed
    NotFound:
      description: Ресурс не найден или скрыт от этого клиента
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: track not found
    Conflict:
      description: Повтор уникальной пары, занятый email или неверный статус трека
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: track is not ready
    TooManyRequests:
      description: Слишком частые регистрация или вход. Ответ не говорит, какая квота сработала.
      x-implemented: false
      headers:
        Retry-After:
          description: Секунды до конца окна
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: too_many_requests
            message: slow down
    Internal:
      description: Сбой сервера. Клиенту не отдаются детали.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal
            message: internal error
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - too_many_requests
            - internal
        message:
          type: string
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    UserReplace:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    UserPatch:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
          description: Если поле передано, пароль заменяется. Иначе остаётся прежним.
    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    UserPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
        limit:
          type: integer
    Track:
      type: object
      required: [id, user_id, title, artist, status, size_bytes]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
          description: Строка для поиска, не аккаунт
        status:
          type: string
          enum: [pending, processing, ready]
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    TrackReplace:
      type: object
      required: [title, artist]
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
    TrackPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
    TrackUploadInit:
      type: object
      required: [title, artist, size]
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
          description: Размер файла в байтах
    TrackUploadSession:
      type: object
      required: [track, upload_url]
      properties:
        track:
          $ref: '#/components/schemas/Track'
        upload_url:
          type: string
          format: uri
    TrackPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        next_cursor:
          type: string
        limit:
          type: integer
    Playlist:
      type: object
      required: [id, owner_id, title, is_public]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        is_public:
          type: boolean
    PlaylistReplace:
      type: object
      required: [title, is_public]
      properties:
        title:
          type: string
          minLength: 1
        is_public:
          type: boolean
    PlaylistPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        is_public:
          type: boolean
