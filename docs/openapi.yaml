openapi: 3.0.3
info:
  title: Sound Chimera API
  version: 1.0.0
  description: |
    Целевой REST-контракт каталога. Файл не заменяет `backend/docs/swagger.yaml`.
    Операция с `x-implemented: false` в коде ещё не сделана.
    Расхождения и сценарии — в `docs/api.md`.
servers:
  - url: /
tags:
  - name: auth
    description: Регистрация и вход
  - name: users
    description: Профили
  - name: tracks
    description: Каталог и публикация
  - name: likes
    description: Любимое
  - name: playlists
    description: Списки пользователя
  - name: picks
    description: Подборки, которые собирает система
  - name: follows
    description: Подписки на авторов

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация
      description: Создаёт аккаунт и сразу выдаёт сессию. Пароль не короче 8 символов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: ada@example.com
              password: long-enough
              name: Ada
      responses:
        '201':
          description: Аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                user:
                  id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                  email: ada@example.com
                  name: Ada
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход
      description: Неизвестный email и неверный пароль дают один и тот же `unauthorized`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: long-enough
      responses:
        '200':
          description: Сессия открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                user:
                  id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                  email: ada@example.com
                  name: Ada
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Справочник пользователей
      description: Весь справочник одним ответом, без курсора. Остальные списки отдают страницу `items`, `next_cursor`, `limit`.
      security: []
      responses:
        '200':
          description: Все профили
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                  email: ada@example.com
                  name: Ada
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      summary: Профиль
      description: Публичный профиль. Пароль в ответ не входит.
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/tracks:
    get:
      tags: [tracks]
      operationId: listUserTracks
      summary: Публичный каталог автора
      description: Только треки со статусом `ready`.
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница готовых треков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              example:
                items:
                  - id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Night Drive
                    artist: Ada
                    status: ready
                    size_bytes: 3200000
                next_cursor: "20"
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/playlists:
    get:
      tags: [playlists]
      operationId: listUserPlaylists
      summary: Публичные плейлисты автора
      description: Только плейлисты с `is_public`. Скрытые сюда не попадают.
      x-implemented: false
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Только плейлисты с `is_public`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
              example:
                items:
                  - id: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
                    owner_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Ночные
                    is_public: true
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/follow:
    put:
      tags: [follows]
      operationId: followUser
      summary: Подписаться
      description: Идемпотентно. Повтор той же пары снова 204. На себя подписаться нельзя.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Подписка есть
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [follows]
      operationId: unfollowUser
      summary: Отписаться
      description: Идемпотентно. Повторное снятие снова 204.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Подписки нет
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/followers:
    get:
      tags: [follows]
      operationId: listFollowers
      summary: Подписчики
      description: Кто подписан на этого пользователя. Страница профилей.
      x-implemented: false
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Кто подписан на этого пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              example:
                items:
                  - id: 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                    email: grace@example.com
                    name: Grace
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/following:
    get:
      tags: [follows]
      operationId: listUserFollowing
      summary: Подписки пользователя
      description: На кого подписан этот пользователь. Страница профилей.
      x-implemented: false
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: На кого подписан этот пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Текущий профиль
      description: Профиль владельца токена. Пароль в ответ не входит.
      responses:
        '200':
          description: Профиль владельца токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [users]
      operationId: replaceCurrentUser
      summary: Заменить свой профиль
      description: Нужны и имя, и email. Пароль этой операцией не меняется.
      x-implemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReplace'
            example:
              email: ada@example.com
              name: Ada Lovelace
      responses:
        '200':
          description: Профиль заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada Lovelace
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [users]
      operationId: updateCurrentUser
      summary: Частично изменить свой профиль
      description: |
        Меняются только переданные поля. Пустое тело не принимается.
        Пароль меняется только здесь.
      x-implemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              name: Ada Lovelace
      responses:
        '200':
          description: Профиль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada Lovelace
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [users]
      operationId: deleteCurrentUser
      summary: Удалить свой аккаунт
      description: Удаляется только аккаунт владельца токена. Повтор по уже удалённому аккаунту — 401, сессии больше нет.
      x-implemented: false
      responses:
        '204':
          description: Аккаунт удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/tracks:
    get:
      tags: [tracks]
      operationId: listMyTracks
      summary: Свои загрузки
      description: Все статусы, включая ещё не опубликованные.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница своих треков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              example:
                items:
                  - id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Night Drive
                    artist: Ada
                    status: pending
                    size_bytes: 3200000
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/likes:
    get:
      tags: [likes]
      operationId: listMyLikes
      summary: Любимое
      description: Только готовые треки.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница любимых треков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              example:
                items:
                  - id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Night Drive
                    artist: Ada
                    status: ready
                    size_bytes: 3200000
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/playlists:
    get:
      tags: [playlists]
      operationId: listMyPlaylists
      summary: Свои плейлисты
      description: Включая скрытые.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница своих плейлистов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
              example:
                items:
                  - id: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
                    owner_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Черновик
                    is_public: false
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/following:
    get:
      tags: [follows]
      operationId: listMyFollowing
      summary: Мои подписки
      description: На кого подписан текущий пользователь. Страница профилей.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: На кого подписан текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/picks:
    get:
      tags: [picks]
      operationId: listMyPicks
      summary: Свои подборки
      description: Новые генерации не затирают старые.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница подборок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickPage'
              example:
                items:
                  - id: a05c607e-b18d-4e5f-d02c-555555555555
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: По лайкам
                    generated_at: '2026-09-25T09:00:00Z'
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [picks]
      operationId: generatePick
      summary: Собрать подборку
      description: |
        Система создаёт новую подборку по лайкам, подпискам и артистам этих треков.
        Состав клиент не передаёт.
      x-implemented: false
      responses:
        '201':
          description: Подборка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickDetail'
              example:
                id: a05c607e-b18d-4e5f-d02c-555555555555
                user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: По лайкам
                generated_at: '2026-09-25T09:00:00Z'
                tracks:
                  - position: 1
                    note: like
                    track:
                      id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                      user_id: 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                      title: Night Drive
                      artist: Ada
                      status: ready
                      size_bytes: 3200000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me/picks/{pickId}:
    get:
      tags: [picks]
      operationId: getMyPick
      summary: Подборка с треками
      description: Подборка текущего пользователя и состав с `position` и `note`. Чужая подборка — 403.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/pickId'
      responses:
        '200':
          description: Подборка и почему выбран каждый трек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickDetail'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [picks]
      operationId: renamePick
      summary: Переименовать подборку
      description: Меняется только название. Состав остаётся за системой.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/pickId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickPatch'
            example:
              title: Ночная
      responses:
        '200':
          description: Название изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pick'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [picks]
      operationId: deletePick
      summary: Удалить подборку
      description: Только своя подборка. Повтор по уже удалённой — 404.
      x-implemented: false
      parameters:
        - $ref: '#/components/parameters/pickId'
      responses:
        '204':
          description: Подборка удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tracks:
    get:
      tags: [tracks]
      operationId: listTracks
      summary: Лента
      description: |
        Только `ready`. `artist` — точное имя без учёта регистра и краевых пробелов.
      security: []
      parameters:
        - $ref: '#/components/parameters/artist'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              example:
                items:
                  - id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Night Drive
                    artist: Ada
                    status: ready
                    size_bytes: 3200000
                next_cursor: "20"
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tracks/upload-init:
    post:
      tags: [tracks]
      operationId: initTrackUpload
      summary: Начать публикацию
      description: |
        Создаёт трек `pending` и временную ссылку на запись объекта.
        Байты файла в этот запрос не входят.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackUploadInit'
            example:
              title: Night Drive
              artist: Ada
              size: 3200000
      responses:
        '201':
          description: Карточка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackUploadSession'
              example:
                track:
                  id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                  user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                  title: Night Drive
                  artist: Ada
                  status: pending
                  size_bytes: 3200000
                upload_url: https://storage.example/music-raw/7c2f3d4b-8e5a-4b2c-ad9f-222222222222.mp3?X-Amz-Signature=example
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
