openapi: 3.0.3
info:
  title: Sound Chimera API
  version: 1.0.0
servers:
  - url: /
tags:
  - name: sessions
    description: Вход
  - name: users
    description: Аккаунты и профили
  - name: tracks
    description: Каталог и публикация
  - name: likes
    description: Любимое
  - name: playlists
    description: Списки пользователя
  - name: picks
    description: Подборки, которые собирает система
  - name: follows
    description: Подписки на авторов

paths:
  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Вход
      description: |
        Открывает сессию и возвращает токен и `user_id` владельца.
        Неизвестный email и неверный пароль дают один и тот же `unauthorized`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              email: ada@example.com
              password: long-enough
      responses:
        '201':
          description: Сессия открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Пользователи
      description: Весь справочник по страницам. Подписчики и подписки — в `GET /v1/follows`.
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница профилей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              example:
                items:
                  - id: 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                    email: grace@example.com
                    name: Grace
                next_cursor: "20"
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [users]
      operationId: createUser
      summary: Регистрация
      description: |
        Создаёт аккаунт. Пароль не короче 8 символов.
        Токен здесь не выдаётся: после регистрации клиент открывает сессию через `POST /v1/sessions`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              email: ada@example.com
              password: long-enough
              name: Ada
      responses:
        '201':
          description: Аккаунт создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      summary: Профиль
      description: Публичный профиль. Пароль в ответ не входит.
      security: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [users]
      operationId: replaceUser
      summary: Заменить профиль
      description: Нужны и имя, и email. Пароль этой операцией не меняется. Только владелец аккаунта.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReplace'
            example:
              email: ada@example.com
              name: Ada Lovelace
      responses:
        '200':
          description: Профиль заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada Lovelace
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Частично изменить профиль
      description: |
        Меняются только переданные поля. Пустое тело не принимается.
        Пароль меняется только здесь. Только владелец аккаунта.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              name: Ada Lovelace
      responses:
        '200':
          description: Профиль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                email: ada@example.com
                name: Ada Lovelace
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Удалить аккаунт
      description: |
        Только владелец аккаунта. Повтор по уже удалённому аккаунту — 401, сессии больше нет.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Аккаунт удалён
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/follows:
    get:
      tags: [follows]
      operationId: listFollows
      summary: Подписки
      description: |
        Нужен хотя бы один фильтр, иначе 400.

        - `follower_id` — на кого подписан пользователь.
        - `following_id` — кто подписан на пользователя.
        - Оба сразу — есть ли подписка у этой пары: страница из одной записи или пустая.

        Если указанного пользователя нет — 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/followerIdQuery'
        - $ref: '#/components/parameters/followingIdQuery'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница подписок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
              example:
                items:
                  - follower:
                      id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                      email: ada@example.com
                      name: Ada
                    following:
                      id: 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                      email: grace@example.com
                      name: Grace
                    created_at: '2026-09-25T09:00:00Z'
                next_cursor: "20"
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [follows]
      operationId: createFollows
      summary: Подписаться на нескольких авторов
      description: |
        Создаёт подписки `follower_id` на всех из `following_ids`.
        `follower_id` должен совпадать с владельцем токена, иначе 403.

        - Атомарно: если хоть одного автора нет — 404, ничего не меняется.
        - Идемпотентно: уже существующие подписки пропускаются, повтор запроса снова 204.
        - Пустой список, повтор внутри списка, `follower_id` в списке или больше 100 идентификаторов — 400.

        Для одного автора — `PUT /v1/follows/{followerId}/{followingId}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowsCreate'
            example:
              follower_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
              following_ids:
                - 9e4b5f6d-a07c-4d4e-cf1b-444444444444
                - b16d718f-c29e-4f60-e13d-666666666666
      responses:
        '204':
          description: Подписки на всех из списка есть
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [follows]
      operationId: deleteFollows
      summary: Отписаться от нескольких авторов
      description: |
        Снимает подписки `follower_id` на всех из `following_id`.
        `follower_id` должен совпадать с владельцем токена, иначе 403.
        Список передаётся в query, а не в теле: тело у DELETE многие клиенты и прокси отбрасывают.

        - Атомарно и идемпотентно: отсутствующие подписки и несуществующие авторы пропускаются, повтор снова 204.
        - Без `following_id` — 400: запрос без списка не снимает все подписки.
        - Повтор внутри списка или больше 100 идентификаторов — 400.

        Для одного автора — `DELETE /v1/follows/{followerId}/{followingId}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/followerIdQueryRequired'
        - $ref: '#/components/parameters/followingIds'
      responses:
        '204':
          description: Подписок на авторов из списка нет
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/follows/{followerId}/{followingId}:
    get:
      tags: [follows]
      operationId: getFollow
      summary: Подписка пары
      description: 200 — подписка есть, 404 — нет её или нет одного из пользователей.
      security: []
      parameters:
        - $ref: '#/components/parameters/followerId'
        - $ref: '#/components/parameters/followingId'
      responses:
        '200':
          description: Подписка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Follow'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [follows]
      operationId: putFollow
      summary: Подписаться на автора
      description: |
        `followerId` должен совпадать с владельцем токена, иначе 403.
        Идемпотентно: повтор той же пары снова 204. На себя подписаться нельзя — 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/followerId'
        - $ref: '#/components/parameters/followingId'
      responses:
        '204':
          description: Подписка есть
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [follows]
      operationId: deleteFollow
      summary: Отписаться от автора
      description: |
        `followerId` должен совпадать с владельцем токена, иначе 403.
        Идемпотентно: повторное снятие снова 204.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/followerId'
        - $ref: '#/components/parameters/followingId'
      responses:
        '204':
          description: Подписки нет
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/users/{userId}/likes/{trackId}:
    put:
      tags: [likes]
      operationId: putLike
      summary: Отметить трек любимым
      description: |
        `userId` должен совпадать с владельцем токена. Только готовый трек.
        Идемпотентно: повтор той же пары снова 204.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/trackId'
      responses:
        '204':
          description: Лайк есть
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [likes]
      operationId: deleteLike
      summary: Снять отметку
      description: |
        `userId` должен совпадать с владельцем токена. Повторное снятие тоже 204.
        404 только если нет самого трека.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/trackId'
      responses:
        '204':
          description: Лайка нет
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tracks:
    get:
      tags: [tracks, likes]
      operationId: listTracks
      summary: Треки
      description: |
        Одна коллекция для ленты, каталога автора, своих загрузок и любимого. Фильтры складываются через И.

        - `user_id` — треки автора.
        - `artist` — точное имя без учёта регистра и краевых пробелов.
        - `liked_by` — любимое пользователя. Только свой `user_id`: без токена 401, чужой — 403.
        - `status` — по умолчанию только `ready`. Если `user_id` совпадает с владельцем токена,
          по умолчанию видны все статусы. Статус кроме `ready` для чужих треков — 403.

        Если Authorization передан, токен должен быть верным.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
        - $ref: '#/components/parameters/artist'
        - $ref: '#/components/parameters/likedBy'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница треков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              example:
                items:
                  - id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                    user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Night Drive
                    artist: Ada
                    status: ready
                    size_bytes: 3200000
                next_cursor: "20"
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [tracks]
      operationId: createTrack
      summary: Создать трек
      description: |
        Создаёт трек `pending` у владельца токена и временную ссылку на запись объекта.
        Байты файла в этот запрос не входят. Публикация — `PATCH /v1/tracks/{trackId}` со `status: ready`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackCreate'
            example:
              title: Night Drive
              artist: Ada
              size: 3200000
      responses:
        '201':
          description: Карточка создана
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackUpload'
              example:
                track:
                  id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                  user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                  title: Night Drive
                  artist: Ada
                  status: pending
                  size_bytes: 3200000
                upload_url: https://storage.example/music-raw/7c2f3d4b-8e5a-4b2c-ad9f-222222222222.mp3?X-Amz-Signature=example
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tracks/{trackId}:
    get:
      tags: [tracks]
      operationId: getTrack
      summary: Карточка трека
      description: |
        Без токена виден только `ready`. Владелец с верным токеном видит свой трек в любом статусе.
        Если заголовок Authorization передан, токен должен быть верным.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/trackId'
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              example:
                id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: Night Drive
                artist: Ada
                status: ready
                size_bytes: 3200000
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [tracks]
      operationId: replaceTrack
      summary: Заменить название и артиста
      description: Оба поля обязательны. Статус, размер и файл не меняются. Только владелец.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/trackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackReplace'
            example:
              title: Night Drive
              artist: Ada
      responses:
        '200':
          description: Карточка заменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [tracks]
      operationId: updateTrack
      summary: Частично изменить трек или опубликовать его
      description: |
        Меняются только переданные поля. Пустое тело не принимается. Только владелец.

        `status: ready` подтверждает загрузку: сервер сверяет владельца и размер объекта
        в хранилище и публикует трек. Если объекта нет, размер не совпал или текущий статус
        не допускает перехода — 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/trackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackPatch'
            examples:
              rename:
                summary: Изменить название
                value:
                  title: Night Drive (demo)
              publish:
                summary: Подтвердить загрузку
                value:
                  status: ready
      responses:
        '200':
          description: Карточка изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              example:
                id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: Night Drive
                artist: Ada
                status: ready
                size_bytes: 3200000
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [tracks]
      operationId: deleteTrack
      summary: Удалить трек
      description: Только владелец. Строки плейлистов и подборок с этим треком уходят, сами списки остаются.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/trackId'
      responses:
        '204':
          description: Трек удалён
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tracks/{trackId}/stream:
    get:
      tags: [tracks]
      operationId: getTrackStream
      summary: Аудио трека
      description: Ответ — переход на временную ссылку чтения. Неготовый трек не отдаётся.
      security: []
      parameters:
        - $ref: '#/components/parameters/trackId'
      responses:
        '302':
          description: Временная ссылка в Location
          headers:
            Location:
              description: Временная ссылка на объект
              schema:
                type: string
                format: uri
              example: https://storage.example/music-raw/7c2f3d4b-8e5a-4b2c-ad9f-222222222222.mp3?X-Amz-Signature=example
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: Плейлисты
      description: |
        Одна коллекция для ленты и плейлистов пользователя, как `GET /v1/tracks`. Фильтры складываются через И.

        - Без фильтров — лента всех публичных плейлистов.
        - `owner_id` — плейлисты пользователя. Если пользователя нет — 404.
        - `is_public` — по умолчанию только публичные. Если `owner_id` совпадает с владельцем токена,
          по умолчанию видны и скрытые. `is_public=false` для чужих плейлистов — 403.

        Если Authorization передан, токен должен быть верным.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ownerId'
        - $ref: '#/components/parameters/isPublic'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница плейлистов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
              example:
                items:
                  - id: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
                    owner_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                    title: Ночные
                    is_public: true
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Создать плейлист
      description: |
        Владелец — владелец токена. Нужны название и флаг публичности.
        Повтор запроса создаёт ещё один плейлист.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistReplace'
            example:
              title: Ночные
              is_public: false
      responses:
        '201':
          description: Плейлист создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
              example:
                id: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
                owner_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: Ночные
                is_public: false
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/playlists/{playlistId}:
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Плейлист
      description: |
        Публичный читается без токена. Скрытый виден только владельцу.
        Чужому скрытому списку отвечаем как отсутствующему.
        Если Authorization передан, токен должен быть верным.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
      responses:
        '200':
          description: Плейлист
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
              example:
                id: 8d3a4e5c-9f6b-4c3d-be0a-333333333333
                owner_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                title: Ночные
                is_public: true
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [playlists]
      operationId: replacePlaylist
      summary: Заменить название и видимость
      description: Оба поля обязательны. Повтор с тем же телом не меняет результат. Только владелец.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistReplace'
            example:
              title: Ночные
              is_public: true
      responses:
        '200':
          description: Плейлист заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Частично изменить плейлист
      description: Меняется только переданное поле. Пустое тело не принимается. Только владелец.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistPatch'
            example:
              is_public: true
      responses:
        '200':
          description: Плейлист изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Удалить плейлист
      description: Только владелец. Повтор по уже удалённому плейлисту — 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
      responses:
        '204':
          description: Плейлист удалён
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/playlists/{playlistId}/tracks:
    get:
      tags: [playlists]
      operationId: listPlaylistTracks
      summary: Треки плейлиста
      description: Только готовые треки, в порядке `position`. Доступ как у самого плейлиста.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Страница состава
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistTrackPage'
              example:
                items:
                  - position: 1
                    track:
                      id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
                      user_id: 6b1e2c3a-7d4f-4a1b-9c8e-111111111111
                      title: Night Drive
                      artist: Ada
                      status: ready
                      size_bytes: 3200000
                limit: 20
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [playlists]
      operationId: createPlaylistTrack
      summary: Добавить трек в плейлист
      description: Только готовый трек. Повтор пары — конфликт. Только владелец плейлиста.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistTrackCreate'
            example:
              track_id: 7c2f3d4b-8e5a-4b2c-ad9f-222222222222
              position: 1
      responses:
        '201':
          description: Трек добавлен
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistTrack'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/playlists/{playlistId}/tracks/{trackId}:
    patch:
      tags: [playlists]
      operationId: updatePlaylistTrack
      summary: Сменить позицию трека
      description: Меняется только `position`. Повтор с тем же значением снова 200. Только владелец плейлиста.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/playlistId'
        - $ref: '#/components/parameters/trackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistTrackPatch'
