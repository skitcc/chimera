map $uri $cache_control {
	default "public, max-age=86400";
	~^/mirror/assets/ "public, max-age=31536000, immutable";
	~^/mirror/ "no-cache";
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	server_tokens off;

	more_set_headers "Server: Chimera";
	more_set_headers "Cache-Control: $cache_control";

	location /mirror/ {
		try_files $uri $uri/ /mirror/index.html;
	}
}
