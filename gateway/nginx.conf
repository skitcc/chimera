map $uri $public_cache {
	default "public, max-age=86400";
	~^/legacy/assets/ "public, max-age=31536000, immutable";
	~^/mirror/assets/ "public, max-age=31536000, immutable";
	~^/(legacy|mirror|reserved)/ "no-cache";
	~^/$ "no-cache";
	~^/index\.html$ "no-cache";
}

map $uri $no_store {
	default 0;
	~^/api/ 1;
	~^/mirror/api/ 1;
	~^/admin 1;
	~^/management 1;
	~^/status 1;
	~^/monitoring 1;
	~^/health$ 1;
	~^/ready$ 1;
}

map $http_authorization $has_auth {
	default 0;
	~.+ 1;
}

map "$no_store$has_auth" $cache_control {
	~^1 "no-store";
	~^01 "private, no-store";
	default $public_cache;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}

upstream chimera_read {
	server api:8080 weight=2;
	server api-read-1:8080 weight=1;
	server api-read-2:8080 weight=1;
}

upstream chimera_write {
	server api:8080;
}

map $request_method $api_upstream {
	GET chimera_read;
	HEAD chimera_read;
	OPTIONS chimera_read;
	default chimera_write;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	charset utf-8;
	client_max_body_size 100m;
	server_tokens off;
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_types
		text/css
		text/plain
		text/javascript
		text/xml
		application/javascript
		application/json
		application/xml
		application/xml+rss
		image/svg+xml;

	more_set_headers "Server: Chimera";
	more_set_headers "Cache-Control: $cache_control";

	location = /health {
		default_type application/json;
		return 200 '{"status":"ok"}';
	}

	location = /ready {
		proxy_pass http://api:8080/ready;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	location = /status/nginx {
		internal;
		stub_status;
	}

	location = /status {
		ssi on;
		default_type text/html;
		alias /usr/share/nginx/html/status.html;
	}

	location = /documentation {
		default_type "text/markdown; charset=utf-8";
		alias /usr/share/nginx/html/documentation/architecture.md;
	}

	location = /management {
		default_type text/html;
		alias /usr/share/nginx/html/management.html;
	}

	location = /monitoring {
		return 301 /monitoring/;
	}

	location /monitoring/ {
		proxy_pass http://grafana:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}

	location = /api/v1/docs {
		return 301 /api/v1/docs/index.html;
	}

	location = /api/v1/docs/ {
		return 301 /api/v1/docs/index.html;
	}

	location ^~ /api/v1/docs/ {
		proxy_pass http://api:8080/swagger/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect /swagger/ /api/v1/docs/;
	}

	location ~ ^/api/(v[12]/.*)$ {
		set $api_path $1;
		if ($api_upstream = chimera_write) {
			rewrite ^ /_write$uri last;
		}

		proxy_pass http://chimera_read/$api_path$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
		proxy_next_upstream error timeout http_502 http_503;
		proxy_next_upstream_tries 2;
	}

	location ~ ^/_write/api/(v[12]/.*)$ {
		internal;
		proxy_pass http://chimera_write/$1$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
		proxy_next_upstream off;
	}

	location = /mirror {
		return 301 /mirror/;
	}

	location ^~ /mirror/api/ {
		rewrite ^/mirror(/api/.*)$ $1 last;
	}

	location /mirror/ {
		proxy_pass http://mirror:80;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location /legacy/ {
		try_files $uri $uri/ /legacy/index.html;
	}

	location = /reserved {
		return 301 /reserved/;
	}

	location /reserved/ {
		try_files /index.html =404;
	}

	include /etc/nginx/admin.location;

	location / {
		try_files $uri $uri/ /index.html;
	}
}
