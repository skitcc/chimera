server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	charset utf-8;
	client_max_body_size 100m;
	absolute_redirect off;

	location = /health {
		default_type application/json;
		return 200 '{"status":"ok"}';
	}

	location = /ready {
		proxy_pass http://api:8080/ready;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	location = /status/nginx {
		internal;
		stub_status;
	}

	location = /status {
		ssi on;
		default_type text/html;
		alias /usr/share/nginx/html/status.html;
	}

	location = /documentation {
		default_type "text/markdown; charset=utf-8";
		alias /usr/share/nginx/html/documentation/architecture.md;
	}

	location = /management {
		default_type text/html;
		alias /usr/share/nginx/html/management.html;
	}

	location = /api/v1/docs {
		return 301 /api/v1/docs/index.html;
	}

	location = /api/v1/docs/ {
		return 301 /api/v1/docs/index.html;
	}

	location /api/v1/docs/ {
		proxy_pass http://api:8080/swagger/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect /swagger/ /api/v1/docs/;
	}

	location /api/v1/ {
		proxy_pass http://api:8080/v1/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
	}

	location /legacy/ {
		try_files $uri $uri/ /legacy/index.html;
	}

	location = /reserved {
		return 301 /reserved/;
	}

	location /reserved/ {
		try_files /index.html =404;
	}

	include /etc/nginx/admin.location;

	location / {
		try_files $uri $uri/ /index.html;
	}
}
